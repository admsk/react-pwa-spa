services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      RAM_SIZE:"8GB"
      CPU_SIZE:"4"
      DISK_SIZE:"100GB"
    volumes:
     - ./data/storage/shared
      VERSION: "win10"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    stop_grace_period: 2m
